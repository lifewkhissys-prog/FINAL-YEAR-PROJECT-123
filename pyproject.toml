[project]
name = "devlab-backend"
version = "0.1.0"
description = "FastAPI backend for DevLab KNUST assessment platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "redis>=5.0.3",
    "pydantic-settings>=2.2.1",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.0",
    "pdfplumber>=0.11.0",
    "groq>=0.5.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pydantic[email]>=2.6.4",
    "bcrypt>=4.0.1",
    "requests>=2.31.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
