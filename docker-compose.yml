
services:
  db:
    image: pgvector/pgvector:pg15
    container_name: devlab_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devlab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devlab"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devlab_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: devlab_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    volumes:
      - .:/app
      - fastembed_cache:/root/.cache/fastembed
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/devlab
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=devlabsecretkeychangeinproduction12345
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_SCORER_MODEL=${GROQ_SCORER_MODEL:-openai/gpt-oss-120b}
      - GROQ_VERIFIER_MODEL=${GROQ_VERIFIER_MODEL:-openai/gpt-oss-20b}
      - GROQ_SYNTHESIS_MODEL=${GROQ_SYNTHESIS_MODEL:-openai/gpt-oss-120b}
      - GROQ_FAST_MODEL=${GROQ_FAST_MODEL:-openai/gpt-oss-20b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      - THESIS_UPLOAD_MAX_MB=20
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  fastembed_cache:

